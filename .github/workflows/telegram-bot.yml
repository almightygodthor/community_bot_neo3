name: GT Neo 3 OTA Telegram Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: gt-neo3-ota-telegram-bot
  cancel-in-progress: false

jobs:
  telegram-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout bot
        uses: actions/checkout@v4

      - name: Run Telegram worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: python3 bot.py
